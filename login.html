<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Entrar — UniVaga</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Lora:wght@600;700&family=Public+Sans:wght@400;500;600;700&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="css/style.css" />
  </head>
  <body class="auth-page">
    <main class="auth-card">
      <img class="auth-photo" src="foto/individual-1.jpg" alt="Quarto individual com cama, janela e mesa de estudos" />
      <h1>Entre na sua conta.</h1>
      <p>Acesse para ver seus favoritos e anunciar imóveis.</p>
      <form action="buscar.html" method="get">
        <label>E-mail<input type="email" name="email" required placeholder="voce@email.com" /></label><label>Senha<input type="password" name="password" required minlength="6" placeholder="Mínimo de 6 caracteres" /></label><button class="btn btn-primary full" type="submit">Entrar</button>
      </form>
      <p class="auth-switch">
        Ainda não tem conta? <a href="cadastro.html">Criar conta</a>
      </p>
      <a class="back-link" href="index.html">Voltar para o início</a>
      <p class="form-note">Tela demonstrativa do projeto acadêmico.</p>
    </main>
    <script src="js/main.js" defer></script>
  </body>
</html>
